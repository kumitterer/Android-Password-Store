name: Sync localisations from Crowdin
on:
  workflow_dispatch:

jobs:
  sync-crowdin:
    container:
      image: cimg/android:2025.03.1-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Sync translations to/from Crowdin
        id: crowdin
        uses: https://github.com/crowdin/github-action@95d6e895e871c3c7acf0cfb962f296baa41e63c6 # v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'New Crowdin Translations'
          pull_request_body: 'New Crowdin translations by [Crowdin GH Action](https://github.com/crowdin/github-action)'
          pull_request_base_branch_name: 'develop'
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PSL_UPDATE_TOKEN }}

      - name: Enable automerge for PR
        shell: bash
        run: |
          gh pr merge --squash --auto "${PR_URL}"
        env:
          GITHUB_TOKEN: ${{ secrets.PSL_UPDATE_TOKEN }}
          PR_URL: ${{ steps.crowdin.outputs.pull-request-url }}
