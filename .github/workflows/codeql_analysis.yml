name: "CodeQL"

on:
  workflow_dispatch:
  # push:
    # branches:
      # - develop
  # pull_request:
    # branches:
      # - develop

env:
  SENTRY_DSN: 'https://public_key@example.com/project_id'

jobs:
  analyze:
    name: Analyze
    container:
      image: cimg/android:2025.03.1-node
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Initialize CodeQL
      uses: https://github.com/github/codeql-action/init@5f8171a638ada777af81d42b55959a643bb29017 # v3.28.12
      with:
        languages: java
        tools: latest
        queries: +security-extended

    - name: Build project
      shell: bash
      run: ./gradlew assembleNonFreeRelease

    - name: Perform CodeQL Analysis
      uses: https://github.com/github/codeql-action/analyze@5f8171a638ada777af81d42b55959a643bb29017 # v3.28.12
      with:
        category: "/language:java"
