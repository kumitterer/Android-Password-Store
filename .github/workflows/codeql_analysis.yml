name: "CodeQL"

on:
  workflow_dispatch:
  # push:
    # branches:
      # - develop
  # pull_request:
    # branches:
      # - develop

env:
  SENTRY_DSN: 'https://public_key@example.com/project_id'

jobs:
  analyze:
    name: Analyze
    runs-on: docker
    container:
      image: cimg/android:2025.10.1-node
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Initialize CodeQL
      uses: https://github.com/github/codeql-action/init@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
      with:
        languages: java
        tools: latest
        queries: +security-extended

    - name: Build project
      shell: bash
      run: ./gradlew assembleNonFreeRelease

    - name: Perform CodeQL Analysis
      uses: https://github.com/github/codeql-action/analyze@5d5cd550d3e189c569da8f16ea8de2d821c9bf7a # v3.31.2
      with:
        category: "/language:java"
